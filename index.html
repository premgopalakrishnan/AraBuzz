<!-- Keeps a copy of the whole app on this device, so it opens with the
     computer switched off and the wifi down. See sw.js. -->
<script>
  /* AraBuzz keeps a whole copy of itself on the device, which is what lets it
     open in the back of a car. The cost of that is real: without the code
     below, a device happily runs a version from three weeks ago and nobody can
     tell. It used to say "an update is ready, it will be there next time" and
     then never take it, because "next time" is another visit to the same
     cached copy.

     So now it takes the update itself. The only thing that matters is WHEN:
     never while a child is answering a question. If she is mid-game the new
     version waits, quietly, until she is back on the home screen. */
  if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
    let reloading = false;

    /* Was this page already governed by a service worker when it loaded?
       Only then does a takeover mean "a NEW version replaced an old one".
       On a first visit the worker installs and claims the page — reloading
       there caused a visible open-flash-reopen. It no longer reloads. */
    const hadController = !!navigator.serviceWorker.controller;

    window.arabuzzTakeUpdate = function () {
      if (reloading || !window.ARABUZZ_UPDATE) return false;
      reloading = true;
      try { if (window.Store) Store.save(true); } catch (e) {}
      /* Cover the screen BEFORE reloading, so taking an update reads as one
         smooth "getting the newest AraBuzz…" rather than an open-flash-reopen.
         The cover is plain inline style — it must work even if the stylesheet
         is the thing being updated. */
      try {
        var cover = document.createElement('div');
        cover.style.cssText = 'position:fixed;inset:0;z-index:9999;display:grid;place-content:center;' +
          'background:#F5F1EA;color:#6b6257;font-family:sans-serif;font-size:15px;text-align:center';
        cover.innerHTML = '<div style="margin-bottom:10px"><img src="assets/cokindle-labs.png" style="height:46px;opacity:.85"></div>Getting the newest AraBuzz…';
        document.body.appendChild(cover);
      } catch (e) {}
      location.reload();
      return true;
    };

    /* The new service worker has taken over. Everything already loaded into
       this page is the old version, so the page has to be read again. */
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController) return;   // first install, not an update — no reload
      window.ARABUZZ_UPDATE = true;
      /* Mid-question is not the only bad moment: a parent halfway through the
         invitation — reading the agreement, typing a code — must never have
         the page pulled out from under them either. The update waits for the
         next quiet screen. */
      const busy = (window.UI && (UI.current === 'quiz' || UI.current === 'puzzle' || UI.current === 'result'))
                || document.body.classList.contains('onboarding');
      if (!busy) window.arabuzzTakeUpdate();
    });

    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').then(reg => {
        window.ARABUZZ_SW = reg;
        reg.update();                                        // ask on every launch
        setInterval(() => { try { reg.update(); } catch (e) {} }, 3600000);
        reg.addEventListener('updatefound', () => {
          const sw = reg.installing;
          if (!sw) return;
          sw.addEventListener('statechange', () => {
            if (sw.state === 'installed' && navigator.serviceWorker.controller) {
              window.ARABUZZ_UPDATE = true;
            }
          });
        });
      }).catch(e => console.warn('offline mode unavailable', e));
    });
  }
</script>
