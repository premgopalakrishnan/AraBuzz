<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120">
  <defs>
    <linearGradient id="ab-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#357C93"/>
      <stop offset="100%" stop-color="#1B4860"/>
    </linearGradient>
    <linearGradient id="ab-head" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0%" stop-color="#F8D189"/>
      <stop offset="52%" stop-color="#E8A33D"/>
      <stop offset="100%" stop-color="#CB831F"/>
    </linearGradient>
    <linearGradient id="ab-beak" x1="0.1" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#F2A184"/>
      <stop offset="55%" stop-color="#E07A5F"/>
      <stop offset="100%" stop-color="#B75439"/>
    </linearGradient>
    <linearGradient id="ab-crest" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#5A8474"/>
      <stop offset="100%" stop-color="#9AC9B1"/>
    </linearGradient>
  </defs>

  <!-- badge -->
  <rect x="2" y="2" width="116" height="116" rx="31" fill="url(#ab-bg)"/>
  <path d="M2 86 Q32 70 62 82 T118 76 L118 87 Q118 118 87 118 L33 118 Q2 118 2 87 Z" fill="#ffffff" opacity="0.06"/>

  <!-- buzz arcs -->
  <g stroke="#F8D189" stroke-width="3.1" stroke-linecap="round" fill="none" opacity="0.9">
    <path d="M99 24 q6.5 6 0 12"/>
    <path d="M107.5 18 q11.5 12 0 24"/>
  </g>

  <!-- crest feathers -->
  <g fill="url(#ab-crest)">
    <path d="M38 38 C31 24 20 19 13 23 C19 32 27 38 35 42 Z"/>
    <path d="M46 30 C43 15 35 7 27 7 C29 18 35 27 42 34 Z"/>
    <path d="M56 26 C58 12 55 4 48 2 C45 11 47 20 51 29 Z"/>
  </g>

  <!-- lower mandible (drawn first, tucks under the hook) -->
  <path d="M52 71 C 74 69 85 77 82 87 C 79 95 65 96 58 89 C 63 84 59 77 52 71 Z"
        fill="#8E3B26"/>

  <!-- upper mandible: hooked macaw beak (left portion hidden by head) -->
  <path d="M50 47
           C 76 40 96 51 94 65
           C 93 78 86 88 76 92
           C 83 79 75 73 50 73 Z"
        fill="url(#ab-beak)" stroke="#A8523A" stroke-width="1.3" stroke-linejoin="round"/>
  <path d="M64 48 C 82 49 91 56 90 65" stroke="#ffffff" stroke-width="2.4" stroke-linecap="round" fill="none" opacity="0.38"/>

  <!-- head -->
  <ellipse cx="44" cy="64" rx="27" ry="28" fill="url(#ab-head)"/>

  <!-- nostril -->
  <ellipse cx="70" cy="53" rx="2.5" ry="1.9" fill="#8E3F2C" opacity="0.45"/>

  <!-- cheek blush -->
  <ellipse cx="31" cy="79" rx="8.5" ry="6.5" fill="#E07A5F" opacity="0.28"/>

  <!-- eye patch -->
  <ellipse cx="53" cy="57" rx="11" ry="11.5" fill="#FDFBF7"/>
  <g stroke="#CBB9A4" stroke-width="1" stroke-linecap="round" opacity="0.7">
    <path d="M46.5 51.5 h11.5"/>
    <path d="M45 56.5 h13.5"/>
    <path d="M46 61.5 h12.5"/>
  </g>
  <circle cx="55.5" cy="56.5" r="5.4" fill="#22333B"/>
  <circle cx="57.5" cy="54.3" r="1.9" fill="#FDFBF7"/>

  <!-- "A" monogram -->
  <path d="M26 101 L33 83 L40 101 M29.2 95 h7.6"
        stroke="#FDFBF7" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.92"/>
</svg>
